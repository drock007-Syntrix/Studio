<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="theme-color" content="#0d0f14">
<title>Syntrix Studio</title>
<!-- Personal, no-cost studio. Runs as a Cloudflare Worker (worker.js): images come from Workers AI's free plan.
     Motion clips are stills animated in the browser, not AI video. History and images live in this browser. -->
<style>
  /* Layout: composer column on the left, masonry gallery on the right; one column under 860px. */
  :root {
    --bg:#0d0f14; --panel:#151922; --raise:#1c212c; --line:#272d3a; --text:#e8ebf2; --muted:#8c94a7;
    --accent:#7c5cff; --accent-soft:#251e45; --ok:#3ecf8e; --warn:#f5b84a; --bad:#ff5c7a;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.45 var(--font); background:var(--bg); color:var(--text); font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; }
  button, select, textarea, input { -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); border-bottom:1px solid var(--line); }
  .brand { font-weight:650; letter-spacing:.2px; font-size:16px; }
  .lamp { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
  .lamp i { width:9px; height:9px; border-radius:50%; background:var(--bad); }
  .lamp.ready i { background:var(--ok); }
  .lamp.busy i { background:var(--warn); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  main { display:grid; grid-template-columns:380px minmax(0,1fr); min-height:calc(100% - 50px); }
  aside { border-right:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:14px; }
  section.gal { padding:16px; min-width:0; display:flex; flex-direction:column; gap:12px; }
  label.h, .h { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; display:block; margin-bottom:5px; }
  .seg, .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button, .chips button, .btn { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  .seg button.on, .chips button.on { border-color:var(--accent); background:var(--accent-soft); }
  .btn:hover, .chips button:hover, .seg button:hover { border-color:#3a4254; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  select, textarea, input[type=text], input[type=password], input[inputmode] { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px; font:inherit; }
  textarea { min-height:104px; resize:vertical; }
  .row { display:flex; gap:10px; align-items:center; } .row > * { min-width:0; }
  .grow { flex:1; }
  .note { color:var(--muted); font-size:12px; margin:4px 0 0; }
  .err { color:var(--bad); min-height:1em; font-size:13px; }
  .go { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:600; cursor:pointer; font-size:15px; display:flex; justify-content:center; gap:8px; }
  .go:disabled { opacity:.5; cursor:not-allowed; }
  .go kbd { font:inherit; opacity:.7; font-size:12px; }
  /* Model picker */
  .picker { position:relative; }
  .pick-btn { width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px; cursor:pointer; }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:10px; padding:1px 7px; color:var(--muted); white-space:nowrap; }
  .tag.free { color:var(--ok); border-color:#25563f; }
  .tag.daily { color:var(--warn); border-color:#5a4520; }
  .pop { position:absolute; z-index:20; top:calc(100% + 6px); left:0; right:0; background:var(--raise); border:1px solid var(--line); border-radius:10px; padding:8px; box-shadow:0 12px 30px #0008; }
  .pop input { margin-bottom:6px; }
  .opt { display:block; width:100%; text-align:left; background:none; border:0; border-radius:8px; padding:8px; cursor:pointer; }
  .opt:hover, .opt.on { background:var(--accent-soft); }
  .opt b { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .opt span { color:var(--muted); font-size:12px; }
  /* Sliders */
  .slider { display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; }
  .slider input { grid-column:1 / -1; width:100%; accent-color:var(--accent); }
  .slider output { color:var(--muted); font-size:12px; }
  /* Start image slot */
  .slot { display:flex; gap:10px; align-items:center; background:var(--panel); border:1px dashed var(--line); border-radius:10px; padding:8px; }
  .slot img { width:56px; height:56px; object-fit:cover; border-radius:6px; }
  .slot .grow { color:var(--muted); font-size:12px; }
  details.more summary { cursor:pointer; color:var(--muted); font-size:12px; }
  details.more[open] summary { margin-bottom:10px; }
  details.more > div { display:flex; flex-direction:column; gap:12px; }
  /* Gallery */
  .rail { display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs button { background:none; border:1px solid transparent; border-radius:8px; padding:6px 10px; cursor:pointer; color:var(--muted); }
  .tabs button[aria-selected=true] { color:var(--text); border-color:var(--line); background:var(--panel); }
  .tabs .n { font-size:11px; color:var(--muted); margin-left:4px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--raise); border:1px solid var(--line); border-radius:10px; padding:8px 10px; position:relative; overflow:hidden; }
  .bar .grow { font-size:13px; }
  .bar .drain { position:absolute; left:0; bottom:0; height:2px; background:var(--accent); animation:drain 6s linear forwards; }
  @keyframes drain { from { width:100%; } to { width:0; } }
  .grid { columns:4 220px; column-gap:12px; }
  .tile { break-inside:avoid; margin-bottom:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; }
  .tile.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .media { position:relative; overflow:hidden; display:grid; place-items:center; cursor:pointer; background:linear-gradient(135deg,#1b2030,#141826); max-width:100%; }
  .media img { width:100%; height:100%; object-fit:cover; display:block; }
  .media.loading { background:linear-gradient(110deg,#171b26 30%,#232a3b 50%,#171b26 70%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .media .fail { color:var(--bad); padding:14px; text-align:center; font-size:13px; }
  .badge { position:absolute; top:8px; left:8px; background:#000a; padding:2px 8px; border-radius:10px; font-size:11px; }
  .check { position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:6px; border:1px solid #fff8; background:#0008; cursor:pointer; display:grid; place-items:center; opacity:0; transition:opacity .15s; }
  .tile:hover .check, .selecting .check, .check.on { opacity:1; }
  .check.on { background:var(--accent); border-color:var(--accent); }
  .meta { padding:9px 10px; display:flex; flex-direction:column; gap:5px; }
  .meta p { margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:13px; }
  .line { display:flex; justify-content:space-between; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
  .acts { display:flex; gap:2px; }
  .acts button { background:none; border:0; color:var(--muted); cursor:pointer; padding:3px 5px; border-radius:6px; font-size:14px; }
  .acts button:hover { color:var(--text); background:var(--raise); }
  .empty { border:1px dashed var(--line); border-radius:12px; padding:28px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:12px; align-items:center; }
  .empty .chips { justify-content:center; }
  .setup { text-align:left; max-width:560px; color:var(--text); }
  .setup ol { margin:6px 0 0; padding-left:20px; color:var(--muted); }
  /* Dialogs */
  dialog { background:var(--raise); color:var(--text); border:1px solid var(--line); border-radius:14px; padding:14px; max-width:min(1100px, 96vw); width:100%; }
  dialog::backdrop { background:#000c; }
  .vgrid { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:14px; }
  .stage { overflow:hidden; border-radius:10px; display:grid; place-items:center; background:#0a0c10; max-height:75vh; }
  .stage img { max-width:100%; max-height:75vh; display:block; }
  .details { display:flex; flex-direction:column; gap:10px; font-size:13px; min-width:0; }
  .details .prompt { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; max-height:160px; overflow:auto; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; color:var(--muted); }
  .kv b { color:var(--text); font-weight:500; overflow-wrap:anywhere; }
  .dacts { display:flex; flex-wrap:wrap; gap:6px; }
  .assets { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; max-height:55vh; overflow:auto; margin-top:10px; }
  .assets button { padding:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); cursor:pointer; aspect-ratio:1; }
  .assets img { width:100%; height:100%; object-fit:cover; display:block; }
  /* Camera moves for Motion clips (applied to the still, looping). */
  .m-dolly-in img { animation:dollyIn 6s ease-in-out infinite alternate; }
  .m-dolly-out img { animation:dollyOut 6s ease-in-out infinite alternate; }
  .m-orbit img { animation:orbit 8s ease-in-out infinite alternate; }
  .m-crane-up img { animation:crane 6s ease-in-out infinite alternate; }
  .m-crash-zoom img { animation:crash 2.5s cubic-bezier(.7,0,.3,1) infinite alternate; }
  .m-fpv img { animation:fpv 4s linear infinite; }
  .m-handheld img { animation:hand 1.6s ease-in-out infinite; transform:scale(1.08); }
  .m-pan img { animation:pan 7s ease-in-out infinite alternate; }
  @keyframes dollyIn { from { transform:scale(1); } to { transform:scale(1.35); } }
  @keyframes dollyOut { from { transform:scale(1.35); } to { transform:scale(1); } }
  @keyframes orbit { from { transform:scale(1.25) translateX(-7%) rotate(-2deg); } to { transform:scale(1.25) translateX(7%) rotate(2deg); } }
  @keyframes crane { from { transform:scale(1.25) translateY(9%); } to { transform:scale(1.15) translateY(-9%); } }
  @keyframes crash { 0%,40% { transform:scale(1); } 100% { transform:scale(1.8); } }
  @keyframes fpv { from { transform:scale(1) translateY(0); } to { transform:scale(1.6) translateY(4%); } }
  @keyframes hand { 0%,100% { transform:scale(1.08) translate(0,0) rotate(0); } 25% { transform:scale(1.08) translate(1%,-.6%) rotate(.4deg); } 50% { transform:scale(1.08) translate(-.6%,.8%) rotate(-.3deg); } 75% { transform:scale(1.08) translate(-1%,-.4%) rotate(.2deg); } }
  @keyframes pan { from { transform:scale(1.3) translateX(-10%); } to { transform:scale(1.3) translateX(10%); } }
  @media (prefers-reduced-motion: reduce) { .media img, .stage img, .media.loading, .lamp i { animation:none !important; } }
  @media (max-width:860px) {
    main { grid-template-columns:1fr; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
    aside, section.gal { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
    .vgrid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Syntrix Studio</span>
  <span class="lamp" id="lamp"><i></i><span id="lampText">Checking engine…</span></span>
</header>
<main>
  <aside>
    <div class="seg" id="kindSeg" role="tablist" aria-label="Output">
      <button data-kind="image" class="on">Image</button><button data-kind="motion">Motion clip</button>
    </div>

    <div class="picker">
      <span class="h">Model</span>
      <button class="pick-btn" id="pickBtn" aria-haspopup="listbox" aria-expanded="false"></button>
      <div class="pop" id="pop" hidden>
        <input type="text" id="pickSearch" placeholder="Search models" autocomplete="off">
        <div id="pickList" role="listbox"></div>
      </div>
    </div>

    <div>
      <div class="row" style="justify-content:space-between"><label class="h" for="prompt">Prompt</label>
        <button class="btn" id="enhance" type="button" style="padding:3px 8px;font-size:12px">✨ Enhance</button></div>
      <textarea id="prompt" placeholder="Describe one picture: subject, setting, light."></textarea>
    </div>

    <div id="slotWrap">
      <span class="h" id="slotLabel">Start image (optional)</span>
      <div class="slot" id="slot"></div>
    </div>

    <div id="aspectWrap"><span class="h">Aspect</span><div class="chips" id="aspects"></div></div>
    <div><span class="h">Style</span><div class="chips" id="styles"></div></div>
    <div id="cameraWrap" hidden><span class="h">Camera move</span><div class="chips" id="cameras"></div>
      <p class="note">Motion clips animate your still with a camera move. They are not AI video.</p></div>

    <div class="row">
      <div class="grow"><label class="h" for="count">Results</label>
        <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
      <div class="grow"><label class="h" for="seed">Seed</label><input id="seed" inputmode="numeric" placeholder="random"></div>
    </div>

    <details class="more" id="more"><summary>Advanced settings</summary><div id="adv"></div></details>

    <div id="pwWrap" hidden><label class="h" for="pw">Studio password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="go" id="go" type="button"><span id="goText">Generate</span><kbd>⌘↵</kbd></button>
    <div class="err" id="err" role="alert"></div>
  </aside>

  <section class="gal">
    <div class="rail">
      <div class="tabs" id="tabs" role="tablist" aria-label="Gallery"></div>
      <button class="btn" id="selectBtn" type="button">Select</button>
    </div>
    <div id="bars"></div>
    <div id="grid"></div>
  </section>
</main>

<dialog id="viewer" aria-label="Result">
  <div class="vgrid">
    <div class="stage" id="vStage"></div>
    <div class="details">
      <div class="row" style="justify-content:space-between"><span class="h" style="margin:0">Prompt</span><button class="btn" id="vCopy" style="padding:3px 8px;font-size:12px">Copy</button></div>
      <div class="prompt" id="vPrompt"></div>
      <div class="kv" id="vKv"></div>
      <div class="dacts" id="vActs"></div>
      <p class="note">← → to move between results. Esc to close.</p>
    </div>
  </div>
</dialog>

<dialog id="assetDlg" aria-label="Choose a start image" style="max-width:720px">
  <div class="row" style="justify-content:space-between">
    <div class="tabs" id="assetTabs" role="tablist">
      <button data-a="uploads" aria-selected="true">Uploads</button><button data-a="history" aria-selected="false">From history</button>
    </div>
    <div class="row" style="width:auto"><label class="btn" for="file" style="cursor:pointer">Upload photo</label><button class="btn" id="assetClose">Close</button></div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="assets" id="assetGrid"></div>
</dialog>

<script>
// ---------------- Catalog: the single source of truth for models and their settings ----------------
const SIZES = {
  xl: { '16:9': [1344, 768], '9:16': [768, 1344], '1:1': [1024, 1024], '4:3': [1152, 896], '3:4': [896, 1152] },
  sd: { '16:9': [896, 512], '9:16': [512, 896], '1:1': [640, 640], '4:3': [768, 576], '3:4': [576, 768] },
  sq: { '1:1': [1024, 1024] },
};
const MODELS = [
  { id: 'flux-schnell', label: 'FLUX.1 schnell', blurb: 'Best overall quality. Square only.', cost: 'daily', sizes: 'sq',
    steps: { min: 1, max: 8, def: 4 }, image: false },
  { id: 'sdxl-lightning', label: 'SDXL Lightning', blurb: 'Fast, any shape. Can start from a photo.', cost: 'free', sizes: 'xl',
    steps: { min: 1, max: 20, def: 8 }, negative: true, image: 'optional' },
  { id: 'sdxl-base', label: 'SDXL Base', blurb: 'Slower, most control: guidance and negative prompt.', cost: 'free', sizes: 'xl',
    steps: { min: 5, max: 20, def: 20 }, guidance: { min: 1, max: 15, def: 7.5 }, negative: true, image: 'optional' },
  { id: 'dreamshaper', label: 'DreamShaper 8', blurb: 'Illustrated, painterly looks. Fast.', cost: 'free', sizes: 'sd',
    steps: { min: 1, max: 20, def: 8 }, negative: true, image: 'optional' },
  { id: 'sd15-img2img', label: 'Restyle a photo', blurb: 'Upload a photo and turn it into something new.', cost: 'free', sizes: 'sd',
    steps: { min: 5, max: 20, def: 20 }, guidance: { min: 1, max: 15, def: 7.5 }, negative: true, image: 'required' },
];
const COST = { free: ['Free', 'free'], daily: ['Daily allowance', 'daily'] };
const STYLES = [
  { id: 'none', label: 'No style', s: '' },
  { id: 'cinematic', label: 'Cinematic', s: 'cinematic lighting, anamorphic lens, film grain, shallow depth of field' },
  { id: 'product', label: 'Product ad', s: 'studio product photography, clean seamless background, softbox lighting, commercial' },
  { id: 'ugc', label: 'UGC selfie', s: 'smartphone selfie, natural light, authentic social media look' },
  { id: 'editorial', label: 'Editorial', s: 'high-fashion editorial photograph, magazine cover quality' },
  { id: 'anime', label: 'Anime', s: 'anime key visual, cel shading, vibrant colors' },
];
const CAMERAS = [
  { id: 'dolly-in', label: 'Dolly in' }, { id: 'dolly-out', label: 'Dolly out' }, { id: 'orbit', label: 'Orbit' },
  { id: 'crane-up', label: 'Crane up' }, { id: 'crash-zoom', label: 'Crash zoom' }, { id: 'fpv', label: 'FPV push' },
  { id: 'handheld', label: 'Handheld' }, { id: 'pan', label: 'Pan' },
];
const STARTERS = [
  'Red vintage pickup parked outside a rural septic service office at golden hour',
  'Hemp shop storefront at night, neon sign reflecting on wet pavement',
  'Glass bottle of CBD oil on a slate slab, soft studio light, product ad',
];
const TABS = [
  { id: 'all', label: 'All' }, { id: 'image', label: 'Images' }, { id: 'motion', label: 'Motion' },
  { id: 'fav', label: 'Favorites' }, { id: 'uploads', label: 'Uploads' },
];
const MAX_HISTORY = 300; // favorites never age out

// ---------------- Storage: metadata in localStorage, image files in IndexedDB ----------------
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let dbp;
function db() {
  dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('syntrixStudio', 2);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('img')) r.result.createObjectStore('img'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function idb(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const tx = d.transaction('img', mode); const q = fn(tx.objectStore('img')); tx.oncomplete = () => res(q?.result); tx.onerror = () => rej(tx.error); });
}
const putBlob = (k, b) => idb('readwrite', (s) => s.put(b, k)).catch(() => {});
const getBlob = (k) => idb('readonly', (s) => s.get(k)).catch(() => null);
const delBlob = (k) => idb('readwrite', (s) => s.delete(k)).catch(() => {});
const urls = new Map(); // blob key -> object URL
async function urlFor(key) {
  if (urls.has(key)) return urls.get(key);
  const b = await getBlob(key); const u = b ? URL.createObjectURL(b) : null;
  urls.set(key, u); return u;
}

// ---------------- State ----------------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const S = {
  engine: 'checking', locked: false,
  kind: 'image', model: ls.get('studioModel', 'flux-schnell'), style: 'cinematic', camera: 'dolly-in', aspect: '1:1',
  steps: {}, guidance: {}, negative: '', strength: 0.6, input: null, // input = { key, label } blob key of start image
  tab: 'all', selecting: false, selected: new Set(), lastClicked: null, pending: null,
  runs: ls.get('studioRuns', []), uploads: ls.get('studioUploads', []),
};
const model = () => MODELS.find((m) => m.id === S.model) || MODELS[0];
const save = () => {
  const dropped = S.runs.filter((r) => !r.fav).slice(MAX_HISTORY);
  dropped.forEach((r) => delBlob(r.id));
  S.runs = S.runs.filter((r) => !dropped.includes(r));
  ls.set('studioRuns', S.runs); ls.set('studioUploads', S.uploads);
};
// Runs that were mid-flight when the page closed cannot resume.
S.runs.forEach((r) => { if (r.status === 'loading') { r.status = 'failed'; r.error = 'Interrupted when the page closed.'; } });

// ---------------- Engine ----------------
const inFlight = () => S.runs.filter((r) => r.status === 'loading').length;
function lamp() {
  const el = $('lamp'); const n = inFlight();
  el.className = 'lamp ' + (S.engine !== 'ready' ? '' : n ? 'busy' : 'ready');
  $('lampText').textContent = S.engine === 'checking' ? 'Checking engine…'
    : S.engine !== 'ready' ? 'Engine not set up' : n ? `Generating ${n}…` : 'Ready · free engine';
}
async function api(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, password: $('pw').value }) });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || `Error ${res.status}`); }
  return res;
}
async function blobToB64(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer()); let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(s);
}
function fullPrompt(r) { return [r.prompt, STYLES.find((s) => s.id === r.style)?.s].filter(Boolean).join(', '); }

async function run(r) {
  try {
    const m = MODELS.find((x) => x.id === r.model);
    const [w, h] = SIZES[m.sizes][r.aspect] || Object.values(SIZES[m.sizes])[0];
    const body = { model: r.model, prompt: fullPrompt(r), seed: r.seed, steps: r.steps, guidance: r.guidance, negative: r.negative, width: w, height: h };
    if (r.input) { const b = await getBlob(r.input.key); if (!b) throw new Error('The start image is no longer on this device.'); body.image_b64 = await blobToB64(b); body.strength = r.strength; }
    const blob = await (await api('/api/image', body)).blob();
    await putBlob(r.id, blob); urls.set(r.id, URL.createObjectURL(blob));
    r.status = 'done';
  } catch (e) { r.status = 'failed'; r.error = e.message; }
  save(); render(); lamp();
}

function launch(spec) {
  const r = { ...spec, id: uid(), at: Date.now(), fav: false, status: 'loading', error: null };
  S.runs.unshift(r); run(r); return r;
}

function currentSpec(seed) {
  const m = model();
  return {
    kind: S.kind, model: m.id, modelLabel: m.label, prompt: $('prompt').value.trim(), style: S.style, camera: S.camera,
    aspect: SIZES[m.sizes][S.aspect] ? S.aspect : Object.keys(SIZES[m.sizes])[0],
    steps: S.steps[m.id] ?? m.steps.def, guidance: m.guidance ? (S.guidance[m.id] ?? m.guidance.def) : undefined,
    negative: m.negative ? S.negative : '', input: m.image ? S.input : null, strength: S.strength, seed,
  };
}

function generate() {
  const m = model(); const prompt = $('prompt').value.trim();
  const err = (t) => { $('err').textContent = t; };
  if (S.engine !== 'ready') return err('The free engine is not set up yet. See the steps in the gallery.');
  if (!prompt) return err('Write a prompt first.');
  if (m.image === 'required' && !S.input) return err('Add a start image for this model.');
  if (S.locked && !$('pw').value) { $('pw').focus(); return err('Enter your studio password first.'); }
  err(''); ls.set('studioPw', $('pw').value);
  const fixed = $('seed').value.trim(); const n = Number($('count').value);
  for (let k = 0; k < n; k++) launch(currentSpec(/^\d+$/.test(fixed) ? Number(fixed) + k : Math.floor(Math.random() * 1e9)));
  save(); setTab(S.tab === 'uploads' || S.tab === 'fav' ? 'all' : S.tab); lamp();
}

// ---------------- Composer ----------------
function chips(el, items, get, set) {
  el.innerHTML = items.map((it) => `<button type="button" data-v="${it.id}" class="${get() === it.id ? 'on' : ''}">${esc(it.label)}</button>`).join('');
  el.onclick = (e) => { const v = e.target.closest('button')?.dataset.v; if (v) { set(v); chips(el, items, get, set); } };
}
function slider(label, id, cfg, val, step, onInput) {
  return `<div class="slider"><label class="h" for="${id}" style="margin:0">${label}</label><output id="${id}O">${val}</output>
    <input type="range" id="${id}" min="${cfg.min}" max="${cfg.max}" step="${step}" value="${val}"></div>`;
}
function renderComposer() {
  const m = model();
  $('pickBtn').innerHTML = `<span>${esc(m.label)}</span><span class="tag ${COST[m.cost][1]}">${COST[m.cost][0]}</span>`;
  [...$('kindSeg').children].forEach((b) => b.classList.toggle('on', b.dataset.kind === S.kind));
  $('cameraWrap').hidden = S.kind !== 'motion';
  $('goText').textContent = S.kind === 'motion' ? 'Generate motion clip' : 'Generate';
  // Aspect: only what this model declares.
  const aspects = Object.keys(SIZES[m.sizes]);
  if (!aspects.includes(S.aspect)) S.aspect = aspects.includes('16:9') ? '16:9' : aspects[0];
  $('aspectWrap').hidden = aspects.length < 2;
  chips($('aspects'), aspects.map((a) => ({ id: a, label: a })), () => S.aspect, (v) => { S.aspect = v; });
  chips($('styles'), STYLES, () => S.style, (v) => { S.style = v; });
  chips($('cameras'), CAMERAS, () => S.camera, (v) => { S.camera = v; });
  // Start image slot.
  $('slotWrap').hidden = !m.image;
  $('slotLabel').textContent = m.image === 'required' ? 'Start image (required)' : 'Start image (optional)';
  if (S.input) urlFor(S.input.key).then((u) => { $('slot').innerHTML = `${u ? `<img src="${u}" alt="">` : ''}<span class="grow">${esc(S.input.label)}</span><button class="btn" id="slotChange">Change</button><button class="btn" id="slotClear">Remove</button>`; });
  else $('slot').innerHTML = `<span class="grow">Start from one of your photos or a past result.</span><button class="btn" id="slotChange">Add image</button>`;
  // Advanced: rendered from the model's allow-list.
  const steps = S.steps[m.id] ?? m.steps.def;
  let adv = slider('Steps', 'stepsR', m.steps, steps, 1);
  if (m.guidance) adv += slider('Guidance', 'guideR', m.guidance, S.guidance[m.id] ?? m.guidance.def, 0.5);
  if (m.image && S.input) adv += slider('Change from start image', 'strR', { min: 0.1, max: 1 }, S.strength, 0.05);
  if (m.negative) adv += `<div><label class="h" for="neg">Avoid (negative prompt)</label><input type="text" id="neg" value="${esc(S.negative)}" placeholder="blurry, text, watermark"></div>`;
  $('adv').innerHTML = adv;
  const bind = (id, fn) => { const el = $(id); if (el) el.oninput = () => { $(id + 'O').textContent = el.value; fn(Number(el.value)); }; };
  bind('stepsR', (v) => { S.steps[m.id] = v; });
  bind('guideR', (v) => { S.guidance[m.id] = v; });
  bind('strR', (v) => { S.strength = v; });
  if ($('neg')) $('neg').oninput = (e) => { S.negative = e.target.value; };
}
$('slot').onclick = (e) => {

$('assetClose').onclick = () => $('assetDlg').close();
async function addUpload(file) {
  // Downscale to 1024px max so uploads stay small and fit the models.
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
  const u = { id: uid(), name: file.name || 'Photo', at: Date.now(), w: c.width, h: c.height };
  await putBlob('u:' + u.id, blob); S.uploads.unshift(u); save();
  return u;
}
$('file').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const u = await addUpload(f); S.input = { key: 'u:' + u.id, label: u.name }; $('assetDlg').close(); renderComposer(); render(); }
  catch { $('assetGrid').insertAdjacentHTML('afterbegin', '<p class="err">That file could not be read as an image.</p>'); }
};

function setTab(t) { S.tab = t; render(); }

function ratio(r) { const m = MODELS.find((x) => x.id === r.model); const s = SIZES[m?.sizes || 'sq'][r.aspect] || [1, 1]; return `${s[0]} / ${s[1]}`; }
function tile(r) {
  const src = urls.get(r.id);
  if (r.status === 'done' && !urls.has(r.id)) urlFor(r.id).then((u) => { if (u) render(); else { r.status = 'failed'; r.error = 'Image no longer on this device.'; save(); render(); } });
  const motion = r.kind === 'motion' ? `m-${r.camera}` : '';
  let media;
  if (r.status === 'failed') media = `<div class="media" style="aspect-ratio:${ratio(r)}"><div class="fail">${esc(r.error || "Didn't generate.")}<br><button class="btn" data-retry="${r.id}" style="margin-top:8px">Retry</button></div></div>`;
  else if (r.status === 'loading' || !src) media = `<div class="media loading" style="aspect-ratio:${ratio(r)}"></div>`;
  else media = `<div class="media ${motion}" data-open="${r.id}" style="aspect-ratio:${ratio(r)}"><img src="${src}" alt="${esc(r.prompt)}">${r.kind === 'motion' ? `<span class="badge">▶ ${esc(CAMERAS.find((c) => c.id === r.camera)?.label)}</span>` : ''}</div>`;
  return `<div class="tile ${S.selected.has(r.id) ? 'sel' : ''}">
    ${media}
    ${r.status !== 'loading' ? `<button class="check ${S.selected.has(r.id) ? 'on' : ''}" data-check="${r.id}" aria-label="Select">${S.selected.has(r.id) ? '✓' : ''}</button>` : ''}
    <div class="meta"><p title="${esc(r.prompt)}">${esc(r.prompt)}</p>
      <div class="line"><span>${esc(r.modelLabel)}</span>
        <span class="acts">
          <button data-fav="${r.id}" title="Favorite" aria-label="Favorite">${r.fav ? '★' : '☆'}</button>
          <button data-reuse="${r.id}" title="Reuse settings" aria-label="Reuse settings">↺</button>
          <button data-del="${r.id}" title="Delete" aria-label="Delete">✕</button>
        </span></div></div></div>`;
}
async function renderUploads() {
  if (!S.uploads.length) return `<div class="empty"><b>No uploads yet</b>Upload a photo to restyle it or use it as a starting point.<button class="btn" id="emptyUpload">Upload photo</button></div>`;
  const items = await Promise.all(S.uploads.map(async (u) => ({ ...u, url: await urlFor('u:' + u.id) })));
  return `<div class="grid">${items.map((u) => `<div class="tile"><div class="media" style="aspect-ratio:${u.w} / ${u.h}">${u.url ? `<img src="${u.url}" alt="">` : ''}</div>
    <div class="meta"><div class="line"><span>${esc(u.name)}</span><span class="acts"><button data-useup="${u.id}" title="Use as start image">Use</button><button data-delup="${u.id}" title="Delete" aria-label="Delete">✕</button></span></div></div></div>`).join('')}</div>`;
}
function emptyState() {
  if (S.engine === 'missing') return `<div class="empty setup"><b>Set up the free engine (one time, about 5 minutes)</b>
    This page needs to run on Cloudflare to generate images. You are viewing a copy that has no engine.
    <ol><li>Sign up free at dash.cloudflare.com.</li><li>Workers &amp; Pages → Create → Import a repository → pick Studio → Deploy.</li>
    <li>Open the workers.dev link Cloudflare gives you and use that from now on.</li></ol></div>`;
  if (S.tab === 'fav') return `<div class="empty">No favorites yet. Tap ☆ on any result to keep it here for good.</div>`;
  return `<div class="empty"><b>Nothing here yet</b>Pick a starter or write your own prompt.
    <div class="chips">${STARTERS.map((s, i) => `<button type="button" data-starter="${i}">${esc(s)}</button>`).join('')}</div></div>`;
}
let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;
  renderTabs(); renderBars(); lamp();
  $('selectBtn').textContent = S.selecting ? 'Done' : 'Select';
  $('selectBtn').hidden = S.tab === 'uploads';
  if (S.tab === 'uploads') { const html = await renderUploads(); if (seq === renderSeq) $('grid').innerHTML = html; return; }
  const list = visible();
  $('grid').className = S.selecting ? 'selecting' : '';
  $('grid').innerHTML = list.length ? `<div class="grid">${list.map(tile).join('')}</div>` : emptyState();
}

function selectRange(id, shift) {
  const list = visible().filter((r) => r.status !== 'loading').map((r) => r.id);
  if (shift && S.lastClicked && list.includes(S.lastClicked)) {
    const [a, b] = [list.indexOf(S.lastClicked), list.indexOf(id)].sort((x, y) => x - y);
    list.slice(a, b + 1).forEach((x) => S.selected.add(x));
  } else S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id);
  S.lastClicked = id; S.selecting = S.selected.size > 0 || S.selecting;
}
function exitSelect() { S.selecting = false; S.selected.clear(); render(); }
$('selectBtn').onclick = () => { if (S.selecting) exitSelect(); else { S.selecting = true; render(); } };

$('grid').onclick = async (e) => {
  const t = e.target.closest('button,[data-open]'); if (!t) return;
  const d = t.dataset; const find = (id) => S.runs.find((r) => r.id === id);
  if (d.starter) { $('prompt').value = STARTERS[d.starter]; $('prompt').focus(); return; }
  if (t.id === 'emptyUpload') { $('file').click(); return; }
  if (d.check) { selectRange(d.check, e.shiftKey); return render(); }
  if (d.open && S.selecting) { selectRange(d.open, e.shiftKey); return render(); }
  if (d.fav) { const r = find(d.fav); r.fav = !r.fav; save(); return render(); }
  if (d.del) return removeRuns([d.del]);
  if (d.reuse) return reuse(find(d.reuse));
  if (d.retry) { const r = find(d.retry); S.runs = S.runs.filter((x) => x !== r); launch({ ...r, id: undefined }); save(); return render(); }
  if (d.useup) { const u = S.uploads.find((x) => x.id === d.useup); if (!model().image) { S.model = 'sdxl-lightning'; } S.input = { key: 'u:' + u.id, label: u.name }; renderComposer(); $('prompt').focus(); return; }
  if (d.delup) { const id = d.delup; S.uploads = S.uploads.filter((u) => u.id !== id); delBlob('u:' + id); if (S.input?.key === 'u:' + id) S.input = null; save(); renderComposer(); return render(); }
  if (d.open) openViewer(d.open);
};

function reuse(r) {
  Object.assign(S, { kind: r.kind, model: r.model, style: r.style, camera: r.camera, aspect: r.aspect, negative: r.negative || '', strength: r.strength ?? 0.6, input: r.input || null });
  S.steps[r.model] = r.steps; if (r.guidance != null) S.guidance[r.model] = r.guidance;
  $('prompt').value = r.prompt; $('seed').value = r.seed;
  renderComposer(); $('prompt').focus();
  if ($('viewer').open) $('viewer').close();
}

// Delete with a 6-second undo.
function removeRuns(ids) {
  if (S.pending) finalizeDelete();
  const removed = S.runs.filter((r) => ids.includes(r.id));
  S.runs = S.runs.filter((r) => !ids.includes(r.id));
  ids.forEach((id) => S.selected.delete(id));
  S.pending = { removed, timer: setTimeout(finalizeDelete, 6000) };
  save(); render();
}
function finalizeDelete() { if (!S.pending) return; clearTimeout(S.pending.timer); S.pending.removed.forEach((r) => { delBlob(r.id); urls.delete(r.id); }); S.pending = null; renderBars(); }
function undoDelete() { if (!S.pending) return; clearTimeout(S.pending.timer); S.runs.push(...S.pending.removed); S.runs.sort((a, b) => b.at - a.at); S.pending = null; save(); render(); }

function renderBars() {
  let html = '';
  if (S.selecting) {
    const n = S.selected.size;
    html += `<div class="bar"><span class="grow">${n ? `${n} selected` : 'Tap results to select. Shift-click selects a range.'}</span>
      <button class="btn" data-bulk="dl" ${n ? '' : 'disabled'}>Download</button><button class="btn" data-bulk="fav" ${n ? '' : 'disabled'}>Favorite</button>
      <button class="btn" data-bulk="unfav" ${n ? '' : 'disabled'}>Unfavorite</button><button class="btn" data-bulk="del" ${n ? '' : 'disabled'}>Delete</button>
      <button class="btn" data-bulk="done">Done</button><span class="note" id="dlNote" style="width:100%;margin:0" hidden></span></div>`;
  }
  if (S.pending) html += `<div class="bar"><span class="grow">Deleted ${S.pending.removed.length} result${S.pending.removed.length > 1 ? 's' : ''}.</span><button class="btn" data-undo="1">Undo</button><div class="drain"></div></div>`;
  $('bars').innerHTML = html;
}
$('bars').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.undo) return undoDelete();
  const ids = [...S.selected];
  switch (b.dataset.bulk) {
    case 'fav': case 'unfav': S.runs.forEach((r) => { if (ids.includes(r.id)) r.fav = b.dataset.bulk === 'fav'; }); save(); return render();
    case 'del': return removeRuns(ids);
    case 'done': return exitSelect();
    case 'dl': return bulkDownload(ids);
  }
};
async function download(r) {
  const u = await urlFor(r.id); if (!u) return false;
  const blob = await getBlob(r.id);
  const a = document.createElement('a'); a.href = u; a.download = `studio-${r.id}.${blob?.type === 'image/png' ? 'png' : 'jpg'}`;
  document.body.appendChild(a); a.click(); a.remove(); return true;
}
async function bulkDownload(ids) {
  const note = $('dlNote'); note.hidden = false; let ok = 0; const missing = [];
  for (const [i, id] of ids.entries()) {
    note.textContent = `Downloading ${i + 1} of ${ids.length}…`;
    const r = S.runs.find((x) => x.id === id);
    if (r && r.status === 'done' && await download(r)) ok++; else missing.push(id);
    await new Promise((res) => setTimeout(res, 400));
  }
  note.textContent = `Downloaded ${ok} of ${ids.length}.${missing.length ? ` ${missing.length} had no image to save.` : ''}`;
}

// ---------------- Viewer ----------------
let viewing = null;
async function openViewer(id) {
  const list = visible().filter((r) => r.status === 'done'); const r = list.find((x) => x.id === id); if (!r) return;
  viewing = id;
  const u = await urlFor(r.id);
  $('vStage').innerHTML = `<div class="${r.kind === 'motion' ? 'm-' + r.camera : ''}" style="overflow:hidden">${u ? `<img src="${u}" alt="">` : ''}</div>`;
  $('vPrompt').textContent = r.prompt;
  const kv = [['Model', r.modelLabel], ['Type', r.kind === 'motion' ? `Motion · ${CAMERAS.find((c) => c.id === r.camera)?.label}` : 'Image'],
    ['Aspect', r.aspect], ['Style', STYLES.find((s) => s.id === r.style)?.label], ['Steps', r.steps], r.guidance != null && ['Guidance', r.guidance],
    r.negative && ['Avoid', r.negative], r.input && ['Start image', `${r.input.label} · change ${r.strength}`], ['Seed', r.seed], ['Made', new Date(r.at).toLocaleString()]].filter(Boolean);
  $('vKv').innerHTML = kv.map(([k, v]) => `<span>${k}</span><b>${esc(v)}</b>`).join('');
  $('vActs').innerHTML = `<button class="btn" data-v="dl">Download</button><button class="btn" data-v="fav">${r.fav ? '★ Favorited' : '☆ Favorite'}</button>
    <button class="btn" data-v="reuse">Reuse settings</button><button class="btn" data-v="recreate">Recreate</button><button class="btn" data-v="close">Close</button>`;
  if (!$('viewer').open) $('viewer').showModal();
}
$('vActs').onclick = (e) => {
  const v = e.target.dataset.v; const r = S.runs.find((x) => x.id === viewing); if (!v || !r) return;
  if (v === 'dl') download(r);
  if (v === 'fav') { r.fav = !r.fav; save(); render(); openViewer(r.id); }
  if (v === 'reuse') reuse(r);
  if (v === 'recreate') { launch({ ...r, id: undefined, seed: Math.floor(Math.random() * 1e9) }); save(); $('viewer').close(); render(); lamp(); }
  if (v === 'close') $('viewer').close();
};
$('vCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('vPrompt').textContent); $('vCopy').textContent = 'Copied'; }
  catch { const rg = document.createRange(); rg.selectNodeContents($('vPrompt')); getSelection().removeAllRanges(); getSelection().addRange(rg); $('vCopy').textContent = 'Selected'; }
  setTimeout(() => { $('vCopy').textContent = 'Copy'; }, 1500);
};
$('viewer').addEventListener('keydown', (e) => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const list = visible().filter((r) => r.status === 'done'); const i = list.findIndex((r) => r.id === viewing);
  const n = list[i + (e.key === 'ArrowRight' ? 1 : -1)]; if (n) openViewer(n.id);
});
$('viewer').onclick = (e) => { if (e.target === $('viewer')) $('viewer').close(); };
$('assetDlg').onclick = (e) => { if (e.target === $('assetDlg')) $('assetDlg').close(); };

// ---------------- Boot ----------------
$('pw').value = ls.get('studioPw', '');
if (!MODELS.some((m) => m.id === S.model)) S.model = MODELS[0].id;
renderComposer(); render();
fetch('/api/health').then((r) => (r.ok ? r.json() : null)).then((h) => {
  S.engine = h?.ok ? 'ready' : 'missing'; S.locked = Boolean(h?.locked); $('pwWrap').hidden = !S.locked; render();
}).catch(() => { S.engine = 'missing'; render(); });
</script>
</body>
