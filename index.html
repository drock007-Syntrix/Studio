<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="theme-color" content="#0d0f14">
<title>Syntrix Studio Free</title>
<!-- Personal, no-cost build. Images come from Pollinations.ai's free public endpoint (no account, no key, no fees).
     "Motion" clips are your generated still animated with a camera move in the browser; they are not AI video. -->
<style>
  :root { --bg:#0d0f14; --panel:#161a22; --line:#262c38; --text:#e8ebf2; --muted:#8b93a6; --accent:#7c5cff; --ok:#3ecf8e; --bad:#ff5c7a; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); }
  header b { font-size:16px; letter-spacing:.3px; }
  .tag { background:var(--panel); border:1px solid var(--line); padding:4px 10px; border-radius:20px; color:var(--ok); font-size:12px; }
  main { display:grid; grid-template-columns:360px 1fr; min-height:calc(100vh - 53px); }
  aside { border-right:1px solid var(--line); padding:18px; display:flex; flex-direction:column; gap:14px; }
  label.h { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:4px; }
  .tabs, .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button, .chips button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; }
  .tabs button.on, .chips button.on { border-color:var(--accent); background:#221c3d; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  select, textarea, input { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  .row2 { display:flex; gap:10px; } .row2 > div { flex:1; min-width:0; }
  .go { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:600; cursor:pointer; font-size:15px; }
  .go:disabled { opacity:.5; cursor:not-allowed; }
  .note { color:var(--muted); font-size:12px; margin:0; }
  .err { color:var(--bad); min-height:1em; }
  section { padding:18px; min-width:0; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .media { background:#0a0c10; display:grid; place-items:center; cursor:pointer; overflow:hidden; position:relative; max-width:100%; }
  .media img { width:100%; height:100%; object-fit:cover; display:block; }
  .media .badge { position:absolute; top:8px; left:8px; background:#000a; padding:2px 8px; border-radius:10px; font-size:11px; }
  .meta { padding:10px; display:flex; flex-direction:column; gap:6px; }
  .meta p { margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; gap:6px; }
  .row button { background:none; border:0; color:var(--muted); cursor:pointer; font-size:15px; padding:2px 4px; }
  .pill { padding:1px 8px; border-radius:10px; font-size:11px; border:1px solid var(--line); }
  .done { color:var(--ok); } .failed { color:var(--bad); }
  .spin { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; position:absolute; }
  @keyframes s { to { transform:rotate(360deg); } }
  .empty { color:var(--muted); padding:40px; text-align:center; grid-column:1/-1; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; max-width:min(1000px,95vw); padding:12px; }
  dialog::backdrop { background:#000b; }
  dialog .stage { overflow:hidden; border-radius:8px; max-height:70vh; display:grid; place-items:center; }
  dialog img { max-width:100%; max-height:70vh; display:block; }
  dialog .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  dialog .actions a, dialog .actions button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; text-decoration:none; cursor:pointer; font:inherit; }
  .confirm { display:flex; gap:6px; align-items:center; }
  .confirm button { border:1px solid var(--line); border-radius:6px; font-size:12px; color:var(--text); }
  /* Camera moves for Motion clips (applied to the image, looping). */
  .m-dolly-in img { animation:dollyIn 6s ease-in-out infinite alternate; }
  .m-dolly-out img { animation:dollyOut 6s ease-in-out infinite alternate; }
  .m-orbit img { animation:orbit 8s ease-in-out infinite alternate; }
  .m-crane-up img { animation:crane 6s ease-in-out infinite alternate; }
  .m-crash-zoom img { animation:crash 2.5s cubic-bezier(.7,0,.3,1) infinite alternate; }
  .m-fpv img { animation:fpv 4s linear infinite; }
  .m-handheld img { animation:hand 1.6s ease-in-out infinite; transform:scale(1.08); }
  .m-pan img { animation:pan 7s ease-in-out infinite alternate; }
  @keyframes dollyIn { from { transform:scale(1); } to { transform:scale(1.35); } }
  @keyframes dollyOut { from { transform:scale(1.35); } to { transform:scale(1); } }
  @keyframes orbit { from { transform:scale(1.25) translateX(-7%) rotate(-2deg); } to { transform:scale(1.25) translateX(7%) rotate(2deg); } }
  @keyframes crane { from { transform:scale(1.25) translateY(9%); } to { transform:scale(1.15) translateY(-9%); } }
  @keyframes crash { 0%,40% { transform:scale(1); } 100% { transform:scale(1.8); } }
  @keyframes fpv { from { transform:scale(1) translateY(0); } to { transform:scale(1.6) translateY(4%); } }
  @keyframes hand { 0%,100% { transform:scale(1.08) translate(0,0) rotate(0); } 25% { transform:scale(1.08) translate(1%,-.6%) rotate(.4deg); } 50% { transform:scale(1.08) translate(-.6%,.8%) rotate(-.3deg); } 75% { transform:scale(1.08) translate(-1%,-.4%) rotate(.2deg); } }
  @keyframes pan { from { transform:scale(1.3) translateX(-10%); } to { transform:scale(1.3) translateX(10%); } }
  @media (prefers-reduced-motion: reduce) { .media img, dialog img { animation:none !important; } }
  @media (max-width:800px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } header, aside, section { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<header><b>Syntrix Studio</b><span class="tag">Free · no keys · no fees</span></header>
<main>
  <aside>
    <div class="tabs" id="kindTabs"><button data-kind="image" class="on">Image</button><button data-kind="motion">Motion clip</button></div>
    <div class="row2">
      <div><label class="h" for="engine">Engine</label>
        <select id="engine"><option value="flux">Flux (best)</option><option value="turbo">Turbo (fastest)</option></select></div>
      <div><label class="h" for="count">Variations</label>
        <select id="count"><option>1</option><option>2</option><option selected>4</option></select></div>
    </div>
    <div><label class="h" for="prompt">Prompt</label>
      <textarea id="prompt">A red vintage pickup parked outside a rural septic service office at golden hour</textarea></div>
    <div><label class="h">Style</label><div class="chips" id="styles"></div></div>
    <div id="cameraWrap" hidden><label class="h">Camera move</label><div class="chips" id="cameras"></div>
      <p class="note">Motion clips animate your generated image with a camera move. They are not AI video.</p></div>
    <div><label class="h">Aspect</label><div class="chips" id="aspects"></div></div>
    <div><label class="h" for="seed">Seed (optional, same seed = same image)</label><input id="seed" inputmode="numeric" placeholder="random"></div>
    <button class="go" id="go">Generate</button>
    <p class="note">Free engine: Pollinations.ai. Images can take 10–60 seconds. Your gallery is saved in this browser only.</p>
    <div class="err" id="err" role="alert"></div>
  </aside>
  <section>
    <div class="bar"><b>Gallery</b><div class="tabs" id="filter"><button data-f="all" class="on">All</button><button data-f="fav">Favorites</button></div></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<dialog id="viewer"><div class="stage" id="viewerMedia"></div><p id="viewerPrompt"></p><div class="actions" id="viewerActions"></div></dialog>
<script>
const STYLES = [
  { id: 'none', label: 'No style', s: '' },
  { id: 'cinematic', label: 'Cinematic', s: 'cinematic lighting, anamorphic lens, film grain, shallow depth of field' },
  { id: 'product', label: 'Product ad', s: 'studio product photography, clean seamless background, softbox lighting, commercial' },
  { id: 'ugc', label: 'UGC selfie', s: 'smartphone selfie, natural light, authentic social media look' },
  { id: 'editorial', label: 'Editorial', s: 'high-fashion editorial photograph, magazine cover quality' },
  { id: 'anime', label: 'Anime', s: 'anime key visual, cel shading, vibrant colors' },
];
const CAMERAS = [
  { id: 'dolly-in', label: 'Dolly in' }, { id: 'dolly-out', label: 'Dolly out' }, { id: 'orbit', label: 'Orbit' },
  { id: 'crane-up', label: 'Crane up' }, { id: 'crash-zoom', label: 'Crash zoom' }, { id: 'fpv', label: 'FPV push' },
  { id: 'handheld', label: 'Handheld' }, { id: 'pan', label: 'Pan' },
];
const ASPECTS = { '16:9': [1280, 720], '9:16': [720, 1280], '1:1': [1024, 1024] };
const ENGINE_URL = 'https://image.pollinations.ai/prompt/';

const $ = (id) => document.getElementById(id);
const state = { kind: 'image', style: 'cinematic', camera: 'dolly-in', aspect: '16:9', filter: 'all', items: [], confirmDel: null };
try { state.items = JSON.parse(localStorage.getItem('syntrixStudioFree') || '[]'); } catch {}
// Items left "loading" by a closed tab get one fresh attempt.
state.items.forEach((i) => { if (i.status === 'loading') i.status = 'retry'; });
const save = () => { try { localStorage.setItem('syntrixStudioFree', JSON.stringify(state.items.slice(0, 300))); } catch {} };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function buildUrl(it) {
  const [w, h] = ASPECTS[it.aspect];
  const full = [it.prompt, STYLES.find((s) => s.id === it.style)?.s].filter(Boolean).join(', ');
  return `${ENGINE_URL}${encodeURIComponent(full)}?width=${w}&height=${h}&seed=${it.seed}&model=${it.engine}&nologo=true`;
}

function chips(el, items, key) {
  el.innerHTML = items.map((it) => `<button type="button" data-v="${it.id}" class="${state[key] === it.id ? 'on' : ''}">${it.label}</button>`).join('');
  el.onclick = (e) => { const v = e.target.dataset.v; if (v) { state[key] = v; chips(el, items, key); } };
}

function mediaHtml(it, big) {
  const cls = it.kind === 'motion' ? `m-${it.camera}` : '';
  const ar = it.aspect.replace(':', '/');
  const badge = it.kind === 'motion' && !big ? `<span class="badge">▶ ${esc(CAMERAS.find((c) => c.id === it.camera)?.label)}</span>` : '';
  if (it.status === 'failed') return `<div class="media" style="aspect-ratio:${ar}"><span class="failed">Didn't generate. Tap ↻ to retry.</span></div>`;
  return `<div class="media ${cls}" data-open="${it.id}" style="aspect-ratio:${ar}">
    ${it.status === 'done' ? '' : '<div class="spin"></div>'}
    <img data-img="${it.id}" src="${esc(it.url)}" alt="${esc(it.prompt)}" loading="lazy" ${it.status === 'done' ? '' : 'style="opacity:0"'}>${badge}</div>`;
}

function render() {
  const items = state.items.filter((i) => state.filter === 'all' || i.fav);
  if (!items.length) { $('grid').innerHTML = `<div class="empty">${state.filter === 'fav' ? 'No favorites yet. Tap ☆ on any image.' : 'Nothing yet. Write a prompt and press Generate.'}</div>`; return; }
  $('grid').innerHTML = items.map((it) => `
    <div class="card">
      ${mediaHtml(it)}
      <div class="meta">
        <p title="${esc(it.prompt)}">${esc(it.prompt)}</p>
        <div class="row"><span>${it.kind === 'motion' ? 'Motion' : 'Image'} · ${esc(it.engine)} · seed ${it.seed}</span>
          <span class="pill ${it.status === 'done' ? 'done' : it.status === 'failed' ? 'failed' : ''}">${it.status === 'done' ? 'ready' : it.status === 'failed' ? 'failed' : 'generating'}</span></div>
        <div class="row"><span>${new Date(it.at).toLocaleString()}</span>
          ${state.confirmDel === it.id
            ? `<span class="confirm">Delete? <button data-yes="${it.id}">Yes</button><button data-no="1">No</button></span>`
            : `<span><button data-fav="${it.id}" title="Favorite" aria-label="Favorite">${it.fav ? '★' : '☆'}</button>
              <button data-retry="${it.id}" title="New variation" aria-label="New variation">↻</button>
              <button data-reuse="${it.id}" title="Reuse settings" aria-label="Reuse settings">✎</button>
              <button data-del="${it.id}" title="Delete" aria-label="Delete">✕</button></span>`}</div>
      </div>
    </div>`).join('');
  // Wire load/error per image; status is tracked so the gallery survives reloads.
  document.querySelectorAll('img[data-img]').forEach((img) => {
    const it = state.items.find((i) => i.id === img.dataset.img);
    if (it.status === 'done') return;
    // Update this card in place so finished images aren't re-requested from the engine.
    const ok = () => {
      it.status = 'done'; save(); img.style.opacity = 1;
      img.parentElement.querySelector('.spin')?.remove();
      const pill = img.closest('.card').querySelector('.pill');
      pill.className = 'pill done'; pill.textContent = 'ready';
    };
    const bad = () => { it.status = 'failed'; save(); render(); };
    if (img.complete && img.naturalWidth) ok(); else { img.onload = ok; img.onerror = bad; }
  });
}

function addItems() {
  const prompt = $('prompt').value.trim();
  if (!prompt) { $('err').textContent = 'Write a prompt first.'; return; }
  $('err').textContent = '';
  const n = Number($('count').value);
  const fixed = $('seed').value.trim();
  for (let k = 0; k < n; k++) {
    const it = {
      id: Math.random().toString(36).slice(2, 10), kind: state.kind, prompt, style: state.style, camera: state.camera,
      aspect: state.aspect, engine: $('engine').value, at: Date.now(), fav: false, status: 'loading',
      seed: fixed && /^\d+$/.test(fixed) ? Number(fixed) + k : Math.floor(Math.random() * 1e9),
    };
    it.url = buildUrl(it);
    state.items.unshift(it);
  }
  save(); state.filter = 'all'; setFilter(); render();
}

function setFilter() { [...$('filter').children].forEach((b) => b.classList.toggle('on', b.dataset.f === state.filter)); }

$('grid').onclick = (e) => {
  const t = e.target.closest('button,[data-open]'); if (!t) return;
  const d = t.dataset; const find = (id) => state.items.find((i) => i.id === id);
  if (d.fav) { const it = find(d.fav); it.fav = !it.fav; save(); return render(); }
  if (d.del) { state.confirmDel = d.del; return render(); }
  if (d.no) { state.confirmDel = null; return render(); }
  if (d.yes) { state.items = state.items.filter((i) => i.id !== d.yes); state.confirmDel = null; save(); return render(); }
  if (d.retry) {
    const src = find(d.retry);
    const it = { ...src, id: Math.random().toString(36).slice(2, 10), seed: Math.floor(Math.random() * 1e9), status: 'loading', fav: false, at: Date.now() };
    it.url = buildUrl(it); state.items.unshift(it); save(); return render();
  }
  if (d.reuse) {
    const it = find(d.reuse);
    Object.assign(state, { kind: it.kind, style: it.style, camera: it.camera, aspect: it.aspect });
    $('prompt').value = it.prompt; $('engine').value = it.engine; $('seed').value = it.seed;
    return setup();
  }
  if (d.open) {
    const it = find(d.open); if (it.status !== 'done') return;
    $('viewerMedia').innerHTML = `<div class="${it.kind === 'motion' ? 'm-' + it.camera : ''}" style="overflow:hidden"><img src="${esc(it.url)}" alt=""></div>`;
    $('viewerPrompt').textContent = it.prompt;
    $('viewerActions').innerHTML = `<a href="${esc(it.url)}" target="_blank" rel="noopener">Open full size (right-click to save)</a><button type="button" id="closeV">Close</button>`;
    $('closeV').onclick = () => $('viewer').close();
    $('viewer').showModal();
  }
};
$('viewer').onclick = (e) => { if (e.target === $('viewer')) $('viewer').close(); };
$('kindTabs').onclick = (e) => { const k = e.target.dataset.kind; if (k) { state.kind = k; setup(); } };
$('filter').onclick = (e) => { const f = e.target.dataset.f; if (f) { state.filter = f; setFilter(); render(); } };
$('go').onclick = addItems;
$('prompt').onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addItems(); };

function setup() {
  [...$('kindTabs').children].forEach((b) => b.classList.toggle('on', b.dataset.kind === state.kind));
  $('cameraWrap').hidden = state.kind !== 'motion';
  $('go').textContent = state.kind === 'motion' ? 'Generate motion clip' : 'Generate';
  chips($('styles'), STYLES, 'style');
  chips($('cameras'), CAMERAS, 'camera');
  chips($('aspects'), Object.keys(ASPECTS).map((a) => ({ id: a, label: a })), 'aspect');
}
setup(); render();
</script>
</body>
</html>
